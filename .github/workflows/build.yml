name: Build Poco F7 (Onyx) OSS Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 clang lld llvm jq

      - name: Setup Clang Toolchain
        run: |
          mkdir -p toolchains
          git clone --depth=1 https://github.com/ZyCromerZ/Clang.git -b main toolchains/clang

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

      - name: Make Build Script Executable
        run: chmod +x setup_droidspaces.sh

      - name: Build Kernel with Droidspaces & ReSukiSU
        env:
          ARCH: arm64
          SUBARCH: arm64
          CC: ccache clang
          LLVM: 1
          LLVM_IAS: 1
        run: |
          export PATH="$PWD/toolchains/clang/bin:$PATH"
          export KCFLAGS="-O2 -mcpu=cortex-x4 -mtune=cortex-x4 -fomit-frame-pointer -fno-stack-protector -mbranch-protection=none"
          
          OUT_DIR="out"
          mkdir -p $OUT_DIR
          
          # Генерируем базовый конфиг для Onyx (SM8735)
          echo "[*] Генерируем конфиг..."
          make O=$OUT_DIR gki_defconfig vendor/sun_perf.config vendor/onyx_perf.config
          
          # Применяем Droidspaces (Namespaces + kABI патч)
          echo "[*] Применяем Droidspaces..."
          ./setup_droidspaces.sh "$OUT_DIR"
          
          # Интегрируем ReSukiSU (KernelSU)
          echo "[*] Интегрируем ReSukiSU..."
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git /tmp/ReSukiSU
          ln -sf /tmp/ReSukiSU/kernel drivers/kernelsu
          
          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            echo "source \"drivers/kernelsu/Kconfig\"" >> drivers/Kconfig
          fi
          if ! grep -q "kernelsu/" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi
          
          scripts/config --file $OUT_DIR/.config -e CONFIG_KSU
          
          # Финализируем конфиг
          make O=$OUT_DIR olddefconfig
          
          # Сборка Image
          echo "[*] Запускаем сборку на $(nproc) потоках..."
          make O=$OUT_DIR -j$(nproc) Image.gz
          
          # Упаковка в AnyKernel3
          cp $OUT_DIR/arch/arm64/boot/Image.gz anykernel/
          cd anykernel
          
          # Правим anykernel.sh под onyx
          sed -i 's/device.name1=/device.name1=onyx/g' anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/.*\/by-name\/boot/block=\/dev\/block\/bootdevice\/by-name\/boot/g' anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=1/g' anykernel.sh # A/B девайс
          
          zip -r9 "../MrJanwise-Onyx-OSS-Droidspaces.zip" * -x .git README.md .gitignore

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MrJanwise-Onyx-OSS
          path: MrJanwise-Onyx-OSS-Droidspaces.zip
