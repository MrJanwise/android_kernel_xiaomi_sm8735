name: Build crDroid 17 Onyx (Droidspaces Final)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Очистка диска и установка зависимостей
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev lld lz4 pahole python3 zip zstd

    - name: Клонирование исходников ядра crDroid
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Скачивание оригинального компилятора Clang 22.0.2 (r596125)
      run: |
        mkdir -p ${{ github.workspace }}/clang
        if ! curl -fLSs https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r596125.tar.gz | tar -xz -C ${{ github.workspace }}/clang; then
          curl -fLSs https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz | tar -xz -C ${{ github.workspace }}/clang
        fi

    - name: Настройка конфига и включение флагов Droidspaces
      run: |
        export PATH="${{ github.workspace }}/clang/bin:$PATH"
        mkdir -p out
        cp current_crdroid.config out/.config
        
        # ВАЖНО: LOCALVERSION = "-4k", хэш коммита запишем отдельно в .scmversion
        ./scripts/config --file out/.config \
          --set-str LOCALVERSION "-4k" \
          -d LOCALVERSION_AUTO \
          -d MODULE_SIG_FORCE \
          -d MODULE_SIG_PROTECT \
          -e SYSVIPC \
          -e POSIX_MQUEUE \
          -e IPC_NS \
          -e PID_NS \
          -e USER_NS \
          -e DEVTMPFS \
          -e NETFILTER_XT_MATCH_ADDRTYPE \
          -e TMPFS_POSIX_ACL \
          -e TMPFS_XATTR
        
        # Жёстко задаём хэш коммита, чтобы vermagic в точности совпал со стоком
        echo "-g10570812a487" > .scmversion
        
        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
        
        echo "=== ПРОВЕРКА ФЛАГОВ ДЛЯ DROIDSPACES ==="
        grep -E "CONFIG_(SYSVIPC|IPC_NS|PID_NS|USER_NS|DEVTMPFS|NETFILTER_XT_MATCH_ADDRTYPE)=" out/.config

    - name: Компиляция ядра
      run: |
        export PATH="${{ github.workspace }}/clang/bin:$PATH"
        # Никаких LOCALVERSION здесь! Всё уже в .config и .scmversion
        make -j$(nproc --all) O=out ARCH=arm64 \
          CC="ccache clang" \
          LLVM=1 \
          LLVM_IAS=1 \
          Image Image.gz

    - name: Проверка vermagic внутри собранного ядра
      run: |
        echo "=== Vermagic в собранном Image ==="
        strings out/arch/arm64/boot/Image | grep "Linux version 6.6.142" | head -n 1

    - name: Упаковка чистого ядра в ZIP (для Termux)
      run: |
        mkdir -p artifacts
        cp out/arch/arm64/boot/Image artifacts/Image
        cp out/arch/arm64/boot/Image.gz artifacts/Image.gz
        cd artifacts
        zip -r9 ../Onyx-Kernel-Ready.zip *

    - name: Выгрузка готового архива
      uses: actions/upload-artifact@v4
      with:
        name: Onyx-Kernel-Ready
        path: "Onyx-Kernel-Ready.zip"
